<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- data-preferences-only="true" -->
 <!-- Cookie banner code start-->
<script src="https://demo-cookie-management.s3.us-west-2.amazonaws.com/cookie_consent_2/e77d95d4-e0a7-46cb-9d01-0378f6511de5/main_25a9d8e.js?gcm=false&prefCenterOnly=false" id="lb-cookie-consent"></script>
<!-- Cookie banner code end-->

    <!-- alert from external script -->
    <script src="https://test-cookies.tiiny.site/show_alert.js"></script>

    <!-- same domain cookies -->
    <script>
      (function () {
        const oneDayExpire = new Date(Date.now() + 86400 * 1000).toUTCString();

        document.cookie =
          "same_domain_cookie_1=local_value_1; expires=" +
          oneDayExpire +
          ";path=/;";
        document.cookie =
          "same_domain_cookie2=local_value_2; expires=" +
          oneDayExpire +
          ";path=/;";
        document.cookie =
          "same_domain_cookie3=local_value_3; expires=" +
          oneDayExpire +
          ";path=/;";
        document.cookie =
          "same_domain_cookie4=local_value_4; expires=" +
          oneDayExpire +
          ";path=/;";
      })();
    </script>
    <title>Test</title>
  </head>
  <body>
    <style>
      html,
      body {
        font-size: 14px;
        line-height: 16px;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
    <h1>This is test</h1>
    <iframe
      title="Inline frame to set cookies"
      width="100"
      height="1"
      src="https://test-cookies.tiiny.site"
      style="opacity: 0"
    >
    </iframe>
    <br />
    <br />

    <br />

      Open preferences center
    </button>
  </body>
